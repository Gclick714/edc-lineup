<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDC 2026 Set Planner</title>
  <meta property="og:title" content="EDC 2026 Set Planner">
  <meta property="og:description" content="Plan your EDC Las Vegas 2026 schedule with friends. Pick your DJs and find conflicts.">
  <meta property="og:type" content="website">
  <meta name="description" content="Plan your EDC Las Vegas 2026 schedule with friends.">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#13131f;--card2:#1a1a2e;--accent:#e040fb;--accent2:#7c4dff;
  --text:#e8e8f0;--text2:#8888aa;--danger:#ff4081;--success:#69f0ae;
  --stage-border:#2a2a3e;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:800px;margin:0 auto;padding:16px}

.screen{display:none}
.screen.active{display:block}

.logo{text-align:center;padding:32px 0}
.logo h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.logo p{color:var(--text2);margin-top:8px;font-size:.9rem}

.name-form{text-align:center;margin-top:40px}
.name-form input{width:100%;max-width:320px;padding:14px 20px;border:2px solid var(--stage-border);border-radius:12px;background:var(--card);color:var(--text);font-size:1.1rem;outline:none;text-align:center}
.name-form input:focus{border-color:var(--accent)}
.name-form button{display:block;margin:20px auto 0;padding:14px 48px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .1s,opacity .1s}
.name-form button:hover{transform:scale(1.03)}
.name-form button:active{transform:scale(.97)}

.tabs{display:flex;gap:4px;margin:16px 0;background:var(--card);border-radius:12px;padding:4px;position:sticky;top:8px;z-index:10}
.tab{flex:1;padding:10px 8px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.tab.active{background:var(--card2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

.day-tabs{display:flex;gap:4px;margin:12px 0}
.day-tab{flex:1;padding:8px;border:1px solid var(--stage-border);border-radius:8px;background:transparent;color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;text-align:center}
.day-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(224,64,251,.08)}

.user-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px}
.user-bar span{color:var(--text2);font-size:.85rem}
.user-bar .name{color:var(--accent);font-weight:600}
.user-bar button{padding:6px 14px;border:1px solid var(--stage-border);border-radius:8px;background:transparent;color:var(--text2);font-size:.8rem;cursor:pointer}

.schedule{display:flex;flex-direction:column;gap:8px}

.time-header{padding:12px 16px 4px;font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;position:sticky;top:60px;background:var(--bg);z-index:5;padding-top:16px}

.set-card{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-radius:10px;border-left:3px solid var(--stage-border);transition:all .15s}
.set-card.hearted{border-left-color:var(--danger);background:rgba(255,64,129,.06)}
.set-card .heart-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text2);transition:transform .15s;flex-shrink:0;width:36px;text-align:center}
.set-card .heart-btn.active{color:var(--danger)}
.set-card .heart-btn:hover{transform:scale(1.15)}
.set-card .info{flex:1;min-width:0}
.set-card .dj-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-card .meta{display:flex;gap:8px;margin-top:4px;font-size:.75rem;color:var(--text2);flex-wrap:wrap}
.set-card .stage-tag{background:var(--card2);padding:2px 8px;border-radius:4px}

.group-view{padding:8px 0}
.person-card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:12px}
.person-card h3{font-size:1rem;margin-bottom:10px;color:var(--accent)}
.person-card .set-item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:8px 0;font-size:.85rem;border-bottom:1px solid var(--stage-border);min-height:3.2rem;align-items:start}
.person-card .set-item:last-child{border:none}
.set-item .time-col{display:flex;flex-direction:column;gap:1px;grid-row:1/3;align-self:start}
.set-item .time-col .tstart{color:var(--text2);font-size:.75rem;line-height:1.2}
.set-item .time-col .tend{color:var(--text2);font-size:.7rem;line-height:1.2}
.set-item .time-col .conflict-badge{color:var(--danger);font-size:.8rem;margin:0}
.set-item .info-col{display:flex;flex-direction:column;gap:1px;grid-row:1/3}
.set-item .info-col .dj-name{font-weight:600;font-size:.85rem;line-height:1.2}
.set-item .info-col .stage{font-size:.7rem;color:var(--text2);border-left:2px solid currentColor;padding-left:4px;line-height:1.2;margin-top:1px}
.set-item .pickers{grid-row:1/3;align-self:start}

.collision-banner{background:rgba(255,64,129,.1);border:1px solid rgba(255,64,129,.3);border-radius:10px;padding:16px;margin-bottom:16px}
.collision-banner h3{color:var(--danger);font-size:1rem;margin-bottom:8px}
.collision-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,64,129,.15);font-size:.85rem}
.collision-item:last-child{border:none}
.collision-item .dj{font-weight:600}
.collision-item .clash-info{color:var(--text2);font-size:.75rem}
.collision-item .people{color:var(--danger);font-weight:600;font-size:.75rem}

.search-bar{width:100%;padding:10px 16px;border:1px solid var(--stage-border);border-radius:10px;background:var(--card);color:var(--text);font-size:.9rem;margin-bottom:12px;outline:none}
.search-bar:focus{border-color:var(--accent)}
.search-bar::placeholder{color:var(--text2)}

.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .icon{font-size:3rem;margin-bottom:12px}

.manage-users{margin-bottom:16px}
.manage-users h3{font-size:.9rem;color:var(--text2);margin-bottom:8px}
.user-chips{display:flex;flex-wrap:wrap;gap:6px}
.user-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--card2);border-radius:8px;font-size:.8rem}
.user-chip .remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;padding:0}

@media(max-width:500px){
  .set-card{padding:10px 12px;gap:8px}
  .set-card .heart-btn{font-size:1.2rem;width:32px}
  .logo h1{font-size:1.5rem}
}
.edit-form{background:var(--card);border-radius:12px;padding:20px;margin-bottom:12px}
.edit-form label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px;margin-top:12px}
.edit-form label:first-child{margin-top:0}
.edit-form input,.edit-form select{width:100%;padding:10px 14px;border:1px solid var(--stage-border);border-radius:8px;background:var(--card2);color:var(--text);font-size:.9rem;outline:none}
.edit-form input:focus,.edit-form select:focus{border-color:var(--accent)}
.edit-form .btn-row{display:flex;gap:8px;margin-top:16px}
.edit-form .btn-save{flex:1;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:.9rem;cursor:pointer}
.edit-form .btn-delete{padding:12px 18px;border:1px solid var(--danger);border-radius:8px;background:transparent;color:var(--danger);font-weight:600;font-size:.9rem;cursor:pointer}
.edit-form .btn-cancel{padding:12px 18px;border:1px solid var(--stage-border);border-radius:8px;background:transparent;color:var(--text2);font-size:.9rem;cursor:pointer}
.edit-result{background:var(--card);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-left:3px solid var(--stage-border);cursor:pointer;transition:all .15s;margin-bottom:6px}
.edit-result:hover{background:var(--card2);border-left-color:var(--accent)}
.edit-result .dj-name{font-weight:600;font-size:.95rem}
.edit-result .meta{font-size:.75rem;color:var(--text2);margin-top:2px}
.edit-add-btn{width:100%;padding:14px;border:2px dashed var(--stage-border);border-radius:10px;background:transparent;color:var(--text2);font-size:.9rem;cursor:pointer;transition:all .15s}
.edit-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--success);color:#000;border-radius:8px;font-weight:600;font-size:.9rem;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.user-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.user-btn{padding:12px 24px;border:1px solid var(--stage-border);border-radius:10px;background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
.user-btn:hover{border-color:var(--accent);background:var(--card2)}
.admin-card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.admin-card .user-info{font-weight:600}
.admin-card .pick-count{font-size:.8rem;color:var(--text2)}
.admin-card .btn-rm{padding:8px 16px;border:1px solid var(--danger);border-radius:8px;background:transparent;color:var(--danger);font-size:.8rem;font-weight:600;cursor:pointer}
.admin-card .btn-rm:hover{background:rgba(255,64,129,.1)}
.conflict-row{background:rgba(255,64,129,.08)!important;border-radius:6px}
.conflict-badge{color:var(--danger);font-size:.85rem;margin-right:2px}
.conflict-detail{padding:8px 12px 8px 28px;border-bottom:1px solid var(--stage-border)}
.conflict-detail-item{padding:6px 0;font-size:.8rem}
.conflict-detail-item+.conflict-detail-item{border-top:1px solid var(--stage-border)}
.pickers{display:flex;gap:4px;flex-wrap:wrap}
.picker-tag{font-size:.65rem;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--accent);white-space:nowrap}
.must-see-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text2);transition:transform .15s;flex-shrink:0;width:36px;text-align:center}
.must-see-btn.active{color:var(--accent)}
.must-see-btn:hover{transform:scale(1.15)}
.mustsee-tag{font-size:.65rem;padding:2px 6px;border-radius:4px;background:rgba(224,64,251,.15);color:var(--accent);white-space:nowrap;font-weight:700}
.save-img-btn{padding:6px 10px;border:1px solid var(--stage-border);border-radius:8px;background:transparent;color:var(--text2);font-size:.7rem;cursor:pointer;transition:all .15s}
.save-img-btn:hover{border-color:var(--accent);color:var(--accent)}
.group-bar{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0 8px;flex-wrap:wrap}
.group-bar span{color:var(--accent);font-weight:600;font-size:.85rem}
.group-bar button{padding:8px 14px;border:1px solid var(--stage-border);border-radius:8px;background:transparent;color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .15s}
.group-bar button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div id="login-screen" class="screen active">
    <div class="logo">
      <h1>EDC Las Vegas</h1>
      <p>Lineup Planner & Collision Detector</p>
    </div>
    <div class="name-form">
      <input type="text" id="name-input" placeholder="Enter your name" maxlength="30" autofocus>
      <button onclick="login()">Enter</button>
    </div>
    <div class="group-bar" id="login-group-bar">
      <span id="group-name-display"></span>
      <button onclick="newGroup()">+ New Group</button>
      <button onclick="shareGroup()">🔗 Share Group</button>
    </div>
    <div id="existing-users" class="user-buttons"></div>
  </div>

  <div id="main-screen" class="screen">
    <div class="user-bar">
      <span>🎵 <span class="name" id="current-user"></span></span>
      <span id="sync-status" style="font-size:.7rem;color:var(--text2)"></span>
      <button onclick="manualSync()">Sync</button>
      <button onclick="shareGroup()">🔗 Share</button>
      <button onclick="switchUser()">Switch User</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('schedule')">Schedule</button>
      <button class="tab" onclick="showTab('my-picks')">My Picks</button>
      <button class="tab" onclick="showTab('group')">Group</button>
      <button class="tab" onclick="showTab('edit')">Edit</button>
      <button class="tab" id="admin-tab-btn" style="display:none" onclick="showTab('admin')">Admin</button>
    </div>
    <div id="schedule-tab"></div>
    <div id="my-picks-tab" style="display:none"></div>
    <div id="group-tab" style="display:none"></div>
    <div id="edit-tab" style="display:none"></div>
    <div id="admin-tab" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const STAGE_COLORS = {
  'kinetic field': '#e040fb',
  'cosmic meadow': '#7c4dff',
  'circuit grounds': '#448aff',
  'basspod': '#ff4081',
  'neon garden': '#69f0ae',
  'quantum valley': '#40c4ff',
  'stereo bloom': '#ffab40',
  'wasteland': '#ff6e40',
  'bionic jungle': '#b2ff59',
  'casa bacardí': '#ffd740',
  'forest house': '#64ffda',
  'yeedc!': '#ea80fc',
  'electrolit hydration house': '#80d8ff',
  'insomniac fridays': '#ff80ab',
  'takis rave hangar': '#ff9100',
  'beatbox art car': '#ff5252',
  'picnic playtime art car': '#ffd180',
};

let schedule = [];
let currentUser = '';
let allUsers = {};
let mustSee = {};
let currentGroup = 'default';
let groupNames = {};
let currentDay = 'Friday';
let searchQuery = '';
let groupHidden = [];
let syncTimer = null;

function gk(suffix) {
  return suffix + '-' + currentGroup;
}

async function loadSchedule() {
  const res = await fetch('schedule.json');
  const base = await res.json();
  // Always start from the canonical schedule.json — this ensures array indices
  // stay consistent across devices. Local edits are stored as an overlay map
  // keyed by index, NOT as a full array replacement.
  schedule = base.map((s, i) => ({ ...s, _id: i }));
  const edits = localStorage.getItem('edc-schedule-edits');
  if (edits) {
    try {
      const overlay = JSON.parse(edits);
      for (const idxStr in overlay) {
        const idx = parseInt(idxStr);
        if (idx >= 0 && idx < schedule.length) {
          schedule[idx] = { ...schedule[idx], ...overlay[idxStr], _id: idx };
        }
      }
    } catch(e) {}
  }
  // Also apply any additions stored separately
  const additions = localStorage.getItem('edc-schedule-additions');
  if (additions) {
    try {
      const extra = JSON.parse(additions);
      extra.forEach(s => schedule.push({ ...s, _id: schedule.length }));
    } catch(e) {}
  }
}

function saveSchedule() {
  // Instead of replacing the entire array, save only the edits (modified entries)
  // This preserves the base schedule indices so all devices stay in sync
  const edits = {};
  const base = JSON.parse(localStorage.getItem('edc-schedule-base') || '[]');
  const maxBaseLen = base.length;
  schedule.forEach((s, i) => {
    if (i < maxBaseLen) {
      const orig = base[i];
      if (s.dj !== orig.dj || s.stage !== orig.stage || s.day !== orig.day || s.start !== orig.start || s.end !== orig.end) {
        edits[i] = { dj: s.dj, stage: s.stage, day: s.day, start: s.start, end: s.end };
      }
    }
  });
  localStorage.setItem('edc-schedule-edits', JSON.stringify(edits));
  // Save any entries beyond the original base length as additions
  if (schedule.length > maxBaseLen) {
    const additions = schedule.slice(maxBaseLen).map(s => ({ dj: s.dj, stage: s.stage, day: s.day, start: s.start, end: s.end }));
    localStorage.setItem('edc-schedule-additions', JSON.stringify(additions));
  } else {
    localStorage.removeItem('edc-schedule-additions');
  }
  scheduleSync();
}

function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToCloud, 2000);
}

function setSyncStatus(msg) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = msg;
}

async function syncToCloud() {
  // Don't push data to cloud if we haven't verified we have the latest cloud data
  if (!cloudSynced) {
    setSyncStatus('waiting for sync...');
    return;
  }
  setSyncStatus('syncing...');
  try {
    // First, fetch the current cloud state to merge authoritatively
    // This prevents stale local data from resurrecting admin-deleted users
    let cloudUsers = {};
    let cloudMustSee = {};
    try {
      const cloudRes = await fetch('/api/data?group=' + encodeURIComponent(currentGroup));
      if (cloudRes.ok) {
        const cloudData = await cloudRes.json();
        if (cloudData.users) cloudUsers = cloudData.users;
        if (cloudData.mustSee) cloudMustSee = cloudData.mustSee;
      }
    } catch(e) {}

    // Merge: cloud is authoritative for which users exist (admin deletions).
    // Uses three-state: undefined (new user) → allow, null (tombstone) → block, Array → allow.
    const mergedUsers = {};
    // Include all cloud-valid users (not tombstoned by admin)
    for (const u in cloudUsers) {
      if (cloudUsers[u] === null) continue; // admin-deleted tombstone
      // If local has this user, use local picks (more recent)
      if (allUsers[u]) mergedUsers[u] = allUsers[u].slice();
      else mergedUsers[u] = []; // keep user with empty picks
    }
    // Add any new local users that don't exist in cloud yet
    for (const u in allUsers) {
      if (!mergedUsers[u]) mergedUsers[u] = allUsers[u].slice();
    }

    const mergedMustSee = {};
    for (const u in cloudMustSee) {
      if (cloudMustSee[u] === null) continue;
      if (mustSee[u]) mergedMustSee[u] = mustSee[u].slice();
      else mergedMustSee[u] = [];
    }
    for (const u in mustSee) {
      if (!mergedMustSee[u]) mergedMustSee[u] = mustSee[u].slice();
    }

    const payload = { group: currentGroup, users: mergedUsers, mustSee: mergedMustSee };
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.ok) {
      // Update local state to match what was sent (so admin removals take effect locally too)
      allUsers = mergedUsers;
      localStorage.setItem(gk('edc-users'), JSON.stringify(allUsers));
      setSyncStatus('synced');
      setTimeout(() => setSyncStatus(''), 3000);
    } else {
      setSyncStatus('sync failed: ' + (json.error || 'unknown'));
    }
  } catch (e) {
    setSyncStatus('sync error: ' + e.message);
  }
}

async function manualSync() {
  setSyncStatus('syncing...');
  await syncToCloud();
  await syncFromCloud();
  renderSchedule();
}

let cloudSynced = false; // guard: true only after a successful cloud fetch

async function syncFromCloud() {
  try {
    const res = await fetch('/api/data?group=' + encodeURIComponent(currentGroup));
    if (!res.ok) return;
    const data = await res.json();

    // Build a set of cloud users that are tombstoned (deleted by admin via null)
    const cloudTombstoned = new Set();
    if (data.users) {
      for (const user in data.users) {
        if (data.users[user] === null) cloudTombstoned.add(user);
      }
    }
    const mustSeeTombstoned = new Set();
    if (data.mustSee) {
      for (const user in data.mustSee) {
        if (data.mustSee[user] === null) mustSeeTombstoned.add(user);
      }
    }

    // Merge cloud users with local users instead of replacing wholesale.
    // This prevents losing new users created locally that haven't synced yet
    // (e.g. first-time use of a new group).
    const newUsers = {};
    if (data.users) {
      for (const user in data.users) {
        const userPicks = data.users[user];
        if (userPicks === null) continue; // skip admin-deleted tombstone
        // If local has this user, keep local picks (more recent / not yet synced)
        if (allUsers[user]) {
          newUsers[user] = allUsers[user].slice();
        } else {
          newUsers[user] = Array.isArray(userPicks) ? [...userPicks] : [];
        }
      }
    }
    // Keep local-only users that haven't been tombstoned by admin
    for (const user in allUsers) {
      if (!newUsers[user] && !cloudTombstoned.has(user)) {
        newUsers[user] = allUsers[user].slice();
      }
    }
    allUsers = newUsers;
    localStorage.setItem(gk('edc-users'), JSON.stringify(allUsers));

    // Same merge logic for mustSee
    const newMustSee = {};
    if (data.mustSee) {
      for (const user in data.mustSee) {
        const userMust = data.mustSee[user];
        if (userMust === null) continue;
        if (mustSee[user]) {
          newMustSee[user] = mustSee[user].slice();
        } else {
          newMustSee[user] = Array.isArray(userMust) ? [...userMust] : [];
        }
      }
    }
    for (const user in mustSee) {
      if (!newMustSee[user] && !mustSeeTombstoned.has(user)) {
        newMustSee[user] = mustSee[user].slice();
      }
    }
    mustSee = newMustSee;
    localStorage.setItem(gk('edc-must-see'), JSON.stringify(mustSee));

    cloudSynced = true; // mark successful cloud fetch
  } catch (e) {
    // If we haven't ever synced from cloud, don't allow pushing stale data up
    cloudSynced = false;
  }
}

function loadUsers() {
  // Load from localStorage as fallback, but cloud data (from syncFromCloud)
  // will overwrite this after the async fetch completes
  const data = localStorage.getItem(gk('edc-users'));
  if (data) {
    try { allUsers = JSON.parse(data); } catch(e) { allUsers = {}; }
  }
}

function saveUsers() {
  localStorage.setItem(gk('edc-users'), JSON.stringify(allUsers));
  scheduleSync();
}

function loadMustSee() {
  // Fallback only — cloud overwrites this after syncFromCloud
  const data = localStorage.getItem(gk('edc-must-see'));
  if (data) {
    try { mustSee = JSON.parse(data); } catch(e) { mustSee = {}; }
  }
}

function saveMustSee() {
  localStorage.setItem(gk('edc-must-see'), JSON.stringify(mustSee));
  scheduleSync();
}

function toggleMustSee(idx) {
  if (!currentUser) return;
  if (!mustSee[currentUser]) mustSee[currentUser] = [];
  const i = mustSee[currentUser].indexOf(idx);
  if (i >= 0) mustSee[currentUser].splice(i, 1);
  else mustSee[currentUser].push(idx);
  saveMustSee();
  renderMyPicks();
}

function saveGroupHidden() {
  if (currentUser) {
    localStorage.setItem(gk('edc-group-hidden-' + currentUser), JSON.stringify(groupHidden));
  }
}

function loadGroupHidden() {
  if (currentUser) {
    const data = localStorage.getItem(gk('edc-group-hidden-' + currentUser));
    groupHidden = data ? JSON.parse(data) : [];
  } else {
    groupHidden = [];
  }
}

function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToCloud, 2000);
}

function setSyncStatus(msg) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = msg;
}

function login() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) return;
  loginAs(name);
}

function loginAs(name) {
  console.log('DEBUG: Logging in as', name, '| Current allUsers:', JSON.stringify(allUsers, null, 2));
  currentUser = name;
  localStorage.setItem('edc-current-user', name);
  // Ensure user has a fresh array (defensive copy if it exists)
  if (!allUsers[name]) {
    allUsers[name] = [];
  } else if (!Array.isArray(allUsers[name])) {
    console.error('User data corrupted for', name, allUsers[name]);
    allUsers[name] = [];
  }
  if (!mustSee[name]) mustSee[name] = [];
  loadGroupHidden();
  console.log('DEBUG: After loginAs, currentUser =', currentUser, '| allUsers[' + name + '] =', allUsers[name]);
  saveUsers();
  document.getElementById('current-user').textContent = name;
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  document.getElementById('name-input').value = '';
  if (name === 'Vince') {
    document.getElementById('admin-tab-btn').style.display = '';
  } else {
    document.getElementById('admin-tab-btn').style.display = 'none';
  }
  renderSchedule();
}

function switchUser() {
  currentUser = '';
  localStorage.removeItem('edc-current-user');
  document.getElementById('main-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('name-input').value = '';
  document.getElementById('name-input').focus();
  renderLoginUsers();
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('schedule-tab').style.display = tab === 'schedule' ? '' : 'none';
  document.getElementById('my-picks-tab').style.display = tab === 'my-picks' ? '' : 'none';
  document.getElementById('group-tab').style.display = tab === 'group' ? '' : 'none';
  document.getElementById('edit-tab').style.display = tab === 'edit' ? '' : 'none';
  document.getElementById('admin-tab').style.display = tab === 'admin' ? '' : 'none';
  if (tab === 'schedule') renderSchedule();
  if (tab === 'my-picks') renderMyPicks();
  if (tab === 'group') renderGroup();
  if (tab === 'edit') renderEdit();
  if (tab === 'admin') renderAdmin();
}

function parseTime(t, day) {
  const [time, period] = t.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  return h * 60 + m;
}

function sortTime(t) {
  const val = parseTime(t);
  if (val < 12 * 60) return val + 24 * 60;
  return val;
}

function getStageColor(stage) {
  const lower = stage.toLowerCase();
  for (const [key, color] of Object.entries(STAGE_COLORS)) {
    if (lower.includes(key.split(' ')[0])) return color;
  }
  return '#888';
}

function toggleHeart(idx) {
  if (!currentUser || !allUsers[currentUser]) {
    console.error('Invalid user state:', currentUser, allUsers);
    return;
  }
  const picks = allUsers[currentUser];
  const i = picks.indexOf(idx);
  if (i >= 0) picks.splice(i, 1);
  else picks.push(idx);
  saveUsers();
  renderSchedule();
}

function renderSchedule() {
  const container = document.getElementById('schedule-tab');
  const picks = allUsers[currentUser] || [];
  const searchHadFocus = document.activeElement && document.activeElement === container.querySelector('.search-bar');

  let html = '<input class="search-bar" type="text" placeholder="Search DJs or stages..." oninput="onSearch(this.value)" value="' + searchQuery + '">';
  html += '<div class="day-tabs">';
  ['Friday', 'Saturday', 'Sunday'].forEach(d => {
    html += '<button class="day-tab' + (d === currentDay ? ' active' : '') + '" onclick="setDay(\'' + d + '\')">' + d + '</button>';
  });
  html += '</div>';

  let filtered;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = schedule.filter(s => !s._deleted && (s.dj.toLowerCase().includes(q) || s.stage.toLowerCase().includes(q)));
    filtered.sort((a, b) => {
      if (a.day !== b.day) return ['Friday','Saturday','Sunday'].indexOf(a.day) - ['Friday','Saturday','Sunday'].indexOf(b.day);
      return sortTime(a.start) - sortTime(b.start);
    });
  } else {
    filtered = schedule.filter(s => !s._deleted && s.day === currentDay);
    filtered.sort((a, b) => sortTime(a.start) - sortTime(b.start));
  }

  let lastDay = '';
  let lastTime = '';
  filtered.forEach((s, i) => {
    if (searchQuery && s.day !== lastDay) {
      html += '<div style="padding:12px 0 4px;font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px">' + s.day + '</div>';
      lastDay = s.day;
      lastTime = '';
    }
    const idx = schedule.indexOf(s);
    if (s.start !== lastTime) {
      html += '<div class="time-header">' + s.start + '</div>';
      lastTime = s.start;
    }
    const hearted = picks.includes(idx);
    const color = getStageColor(s.stage);
    html += '<div class="set-card' + (hearted ? ' hearted' : '') + '">';
    html += '<button class="heart-btn' + (hearted ? ' active' : '') + '" onclick="toggleHeart(' + idx + ')">' + (hearted ? '❤️' : '🤍') + '</button>';
    html += '<div class="info">';
    html += '<div class="dj-name">' + s.dj + '</div>';
    html += '<div class="meta">';
    html += '<span class="stage-tag" style="border-left:2px solid ' + color + ';padding-left:6px">' + s.stage + '</span>';
    html += '<span>' + s.start + ' - ' + s.end + '</span>';
    html += '</div></div></div>';
  });

  container.innerHTML = html;
  if (searchHadFocus) restoreScheduleSearchFocus();
}

function setDay(d) { currentDay = d; renderSchedule(); }
function onSearch(v) { searchQuery = v; renderSchedule(); restoreScheduleSearchFocus(); }

function toggleHeartMyPicks(idx) {

  renderMyPicks();
}

function timesOverlap(a, b) {
  const aStart = parseTime(a.start, a.day);
  let aEnd = parseTime(a.end, a.day);
  if (aEnd <= aStart) aEnd += 1440;
  const bStart = parseTime(b.start, b.day);
  let bEnd = parseTime(b.end, b.day);
  if (bEnd <= bStart) bEnd += 1440;
  return aStart < bEnd && bStart < aEnd;
}

function overlapMinutes(a, b) {
  const aStart = parseTime(a.start, a.day);
  let aEnd = parseTime(a.end, a.day);
  if (aEnd <= aStart) aEnd += 1440;
  const bStart = parseTime(b.start, b.day);
  let bEnd = parseTime(b.end, b.day);
  if (bEnd <= bStart) bEnd += 1440;
  const overlapStart = Math.max(aStart, bStart);
  const overlapEnd = Math.min(aEnd, bEnd);
  return Math.max(0, overlapEnd - overlapStart);
}

function minsToTimeStr(totalMins) {
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  if (h > 0 && m > 0) return h + 'h ' + m + 'm';
  if (h > 0) return h + 'h';
  return m + 'm';
}

function renderGroup() {
  const container = document.getElementById('group-tab');
  const allWithPicks = Object.keys(allUsers).filter(u => allUsers[u].length > 0);

  if (allWithPicks.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">👥</div><p>No one has picked any DJs yet.</p></div>';
    return;
  }

  const shown = allWithPicks.filter(u => !groupHidden.includes(u));
  const hidden = allWithPicks.filter(u => groupHidden.includes(u));

  let html = '<div class="manage-users"><h3>Users with picks</h3><div class="user-chips">';
  shown.forEach(u => {
    html += '<span class="user-chip">' + u + ' <button class="remove" onclick="hideFromGroup(\'' + u.replace(/'/g, "\\'") + '\')">&times;</button></span>';
  });
  html += '</div>';
  if (hidden.length > 0) {
    html += '<h3 style="margin-top:10px">Hidden</h3><div class="user-chips">';
    hidden.forEach(u => {
      html += '<span class="user-chip" style="opacity:.5;text-decoration:line-through">' + u + ' <button class="remove" style="color:var(--success)" onclick="showInGroup(\'' + u.replace(/'/g, "\\'") + '\')">+</button></span>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '<div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap">';
  html += '<button class="save-img-btn" onclick="saveGroupAsImage(\'Friday\')">📸 Save Friday</button>';
  html += '<button class="save-img-btn" onclick="saveGroupAsImage(\'Saturday\')">📸 Save Saturday</button>';
  html += '<button class="save-img-btn" onclick="saveGroupAsImage(\'Sunday\')">📸 Save Sunday</button>';
  html += '</div>';

  const pickMap = {};
  shown.forEach(user => {
    (allUsers[user] || []).forEach(idx => {
      if (!pickMap[idx]) pickMap[idx] = [];
      pickMap[idx].push(user);
    });
  });

  let allItems = Object.entries(pickMap).map(([idx, users]) => ({ idx: parseInt(idx), s: schedule[parseInt(idx)], users })).filter(x => x.s && !x.s._deleted);
  allItems.sort((a, b) => {
    if (a.s.day !== b.s.day) return ['Friday','Saturday','Sunday'].indexOf(a.s.day) - ['Friday','Saturday','Sunday'].indexOf(b.s.day);
    return sortTime(a.s.start) - sortTime(b.s.start);
  });

  if (allItems.length === 0) {
    container.innerHTML += '<div class="empty"><p>No picks to show.</p></div>';
    return;
  }

  let collisions = [];
  if (shown.length >= 2) collisions = findCollisions(shown);
  const conflictMap = {};
  collisions.forEach(c => {
    const sIdx0 = schedule.indexOf(c.sets[0]);
    const sIdx1 = schedule.indexOf(c.sets[1]);
    if (!conflictMap[sIdx0]) conflictMap[sIdx0] = [];
    if (!conflictMap[sIdx1]) conflictMap[sIdx1] = [];
    conflictMap[sIdx0].push(c);
    conflictMap[sIdx1].push(c);
  });

  let conflictId = 0;
  html += '<div class="person-card">';
  let lastDay = '';
  allItems.forEach(({ idx, s, users }) => {
    if (s.day !== lastDay) {
      html += '<div style="padding:6px 0 2px;font-size:.75rem;color:var(--accent);font-weight:700">' + s.day + '</div>';
      lastDay = s.day;
    }
    const color = getStageColor(s.stage);
    const conflicts = conflictMap[idx] || [];
    const hasConflict = conflicts.length > 0;
    const cid = 'conflict-' + conflictId++;
    html += '<div class="set-item' + (hasConflict ? ' conflict-row' : '') + '" style="cursor:' + (hasConflict ? 'pointer' : 'default') + '"' + (hasConflict ? ' onclick="toggleConflict(\'' + cid + '\')"' : '') + '>';
    html += '<div class="time-col">';
    if (hasConflict) html += '<span class="conflict-badge">⚡</span>';
    html += '<span class="tstart">' + s.start + '</span>';
    html += '<span class="tend">' + s.end + '</span>';
    html += '</div>';
    html += '<div class="info-col">';
    html += '<span class="dj-name">' + s.dj + '</span>';
    html += '<span class="stage" style="border-left-color:' + color + '">' + s.stage + '</span>';
    html += '</div>';
    html += '<span class="pickers">' + users.map(u => {
      let tag = '<span class="picker-tag">' + u + '</span>';
      if ((mustSee[u] || []).includes(idx)) {
        tag += '<span class="mustsee-tag">⭐</span>';
      }
      return tag;
    }).join('') + '</span>';
    html += '</div>';
    if (hasConflict) {
      html += '<div id="' + cid + '" class="conflict-detail" style="display:none">';
      conflicts.forEach(c => {
        const other = c.sets[0] === s ? c.sets[1] : c.sets[0];
        const oMins = overlapMinutes(c.sets[0], c.sets[1]);
        const otherUser = c.people.find(p => !users.includes(p)) || c.people[0];
        html += '<div class="conflict-detail-item">';
        html += '<span style="color:var(--danger)">⚡</span> ';
        html += 'Conflicts with <b>' + other.dj + '</b> (' + other.stage + ')';
        html += '<br><span style="color:var(--text2)">' + other.start + ' - ' + other.end + ' &middot; wanted by ' + otherUser + '</span>';
        html += '<br><span style="color:var(--danger)">Overlaps ' + minsToTimeStr(oMins) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }
  });
  html += '</div>';

  container.innerHTML = html;
}

function saveGroupAsImage(day) {
  const allWithPicks = Object.keys(allUsers).filter(u => allUsers[u].length > 0 && !groupHidden.includes(u));
  const pickMap = {};
  allWithPicks.forEach(user => {
    (allUsers[user] || []).forEach(idx => {
      if (!pickMap[idx]) pickMap[idx] = [];
      pickMap[idx].push(user);
    });
  });

  let allItems = Object.entries(pickMap).map(([idx, users]) => ({ idx: parseInt(idx), s: schedule[parseInt(idx)], users })).filter(x => x.s && x.s.day === day && !x.s._deleted);
  allItems.sort((a, b) => sortTime(a.s.start) - sortTime(b.s.start));

  if (allItems.length === 0) {
    showToast('No picks for ' + day);
    return;
  }

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'background:#1a1a2e;padding:20px;width:400px;font-family:system-ui,sans-serif;color:#e0e0e0;border-radius:12px';
  let html = '<h2 style="margin:0 0 8px;font-size:1.2rem;color:#e040fb">EDC 2026 - ' + day + '</h2>';
  html += '<div style="font-size:.8rem;color:#888;margin-bottom:12px">Picks: ' + allWithPicks.join(', ') + '</div>';

  allItems.forEach(({ idx, s, users }) => {
    const color = getStageColor(s.stage);
    html += '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #333;gap:8px">';
    html += '<span style="font-size:.75rem;color:#888;width:70px;flex-shrink:0">' + s.start + '</span>';
    html += '<span style="border-left:3px solid ' + color + ';padding-left:8px;font-weight:600;font-size:.85rem">' + s.dj + '</span>';
    html += '<span style="margin-left:auto;font-size:.7rem;color:#888;padding-right:8px">' + s.stage + '</span>';
    html += '<span style="font-size:.7rem;display:flex;gap:4px;flex-wrap:wrap">';
    users.forEach(u => {
      html += '<span style="background:rgba(224,64,251,.15);padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:600">' + u + '</span>';
      if ((mustSee[u] || []).includes(idx)) {
        html += '<span style="font-size:.65rem">⭐</span>';
      }
    });
    html += '</span></div>';
  });

  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);

  html2canvas(wrapper, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#1a1a2e',
    logging: false
  }).then(canvas => {
    document.body.removeChild(wrapper);
    const link = document.createElement('a');
    link.download = 'EDC-2026-' + day.replace(/\s+/g, '-') + '-Picks.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      canvas.toBlob(blob => {
        if (blob) {
          navigator.share({ title: 'EDC 2026 ' + day + ' Picks', files: [new File([blob], link.download, { type: 'image/jpeg' })] }).catch(() => link.click());
        } else { link.click(); }
      }, 'image/jpeg', 0.92);
    } else { link.click(); }
    showToast('Image saved!');
  }).catch(err => {
    document.body.removeChild(wrapper);
    console.error(err);
    showToast('Error generating image');
  });
}

function hideFromGroup(name) {
  if (!groupHidden.includes(name)) groupHidden.push(name);
  saveGroupHidden();
  renderGroup();
}

function showInGroup(name) {
  groupHidden = groupHidden.filter(u => u !== name);
  saveGroupHidden();
  renderGroup();
}

function toggleConflict(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

function findCollisions(users) {
  const collisions = [];
  const userSets = {};
  users.forEach(u => {
    userSets[u] = (allUsers[u] || []).map(i => schedule[i]).filter(Boolean).filter(s => !s._deleted);
  });

  for (let i = 0; i < users.length; i++) {
    for (let j = i + 1; j < users.length; j++) {
      const a = userSets[users[i]];
      const b = userSets[users[j]];
      a.forEach(sa => {
        b.forEach(sb => {
          if (sa.day === sb.day && timesOverlap(sa, sb) && sa !== sb) {
            const existing = collisions.find(c =>
              c.sets.some(s => s === sa) && c.sets.some(s => s === sb)
            );
            if (existing) {
              if (!existing.people.includes(users[i])) existing.people.push(users[i]);
              if (!existing.people.includes(users[j])) existing.people.push(users[j]);
            } else {
              collisions.push({
                sets: [sa, sb],
                people: [users[i], users[j]]
              });
            }
          }
        });
      });
    }
  }
  return collisions;
}

    html += '<button class="btn-delete" onclick="deleteEntry()">Delete</button>';
    html += '<button class="btn-cancel" onclick="cancelEdit()">Cancel</button>';
    html += '</div></div>';
  }

  if (editSearch.length > 0) {
    const q = editSearch.toLowerCase();
    const results = schedule.filter(s => !s._deleted && (s.dj.toLowerCase().includes(q) || s.stage.toLowerCase().includes(q)));
    results.sort((a, b) => {
      if (a.day !== b.day) return ['Friday','Saturday','Sunday'].indexOf(a.day) - ['Friday','Saturday','Sunday'].indexOf(b.day);
      return sortTime(a.start) - sortTime(b.start);
    });
    results.forEach(s => {
      const idx = schedule.indexOf(s);
      const color = getStageColor(s.stage);
      html += '<div class="edit-result" onclick="startEdit(' + idx + ')">';
      html += '<div><div class="dj-name">' + s.dj + '</div>';
      html += '<div class="meta">' + s.day + ' &middot; ' + s.start + ' - ' + s.end + ' &middot; <span style="color:' + color + '">' + s.stage + '</span></div>';
      html += '</div></div>';
    });
    if (results.length === 0) {
      html += '<div class="empty"><p>No matches found.</p></div>';
    }
  }

  html += '<button class="edit-add-btn" onclick="addNewEntry()">+ Add New DJ Entry</button>';

  container.innerHTML = html;
}

function onEditSearch(v) { editSearch = v; editingIdx = null; renderEdit(); restoreSearchFocus(); }

function restoreSearchFocus() {
  const input = document.querySelector('#edit-tab .search-bar');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function restoreScheduleSearchFocus() {
  const input = document.querySelector('#schedule-tab .search-bar');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function startEdit(idx) { editingIdx = idx; renderEdit(); }

function cancelEdit() { editingIdx = null; renderEdit(); }

function saveEdit() {
  if (editingIdx === null) return;
  const dj = document.getElementById('edit-dj').value.trim();
  const stage = document.getElementById('edit-stage').value.trim();
  const day = document.getElementById('edit-day').value;
  const start = document.getElementById('edit-start').value.trim();
  const end = document.getElementById('edit-end').value.trim();
  if (!dj || !stage || !start || !end) { showToast('All fields required'); return; }
  // Preserve _id so array index remains stable across devices
  schedule[editingIdx] = { dj, stage, day, start, end, _id: schedule[editingIdx]._id || editingIdx };
  saveSchedule();
  showToast('Saved!');
  editingIdx = null;
  editSearch = dj;
  renderEdit();
}

function deleteEntry() {
  if (editingIdx === null) return;
  // Instead of splicing (which shifts all indices), mark as deleted by zeroing out
  schedule[editingIdx] = { dj: '[deleted]', stage: '', day: schedule[editingIdx].day, start: '', end: '', _deleted: true };
  // Remove this index from all users' picks
  Object.keys(allUsers).forEach(u => {
    allUsers[u] = allUsers[u].filter(i => i !== editingIdx);
  });
  saveSchedule();
  saveUsers();
  showToast('Deleted');
  editingIdx = null;
  renderEdit();
}

function addNewEntry() {
  schedule.push({ dj: 'New DJ', stage: 'Stage', day: 'Friday', start: '7:00 PM', end: '8:00 PM', _id: schedule.length });
  saveSchedule();
  editingIdx = schedule.length - 1;
  renderEdit();
}

function renderLoginUsers() {
  const container = document.getElementById('existing-users');
  const users = Object.keys(allUsers);
  if (users.length === 0) { container.innerHTML = ''; return; }
  let html = '';
  users.sort();
  users.forEach(u => {
    html += '<button class="user-btn" onclick="loginAs(\'' + u.replace(/'/g, "\\'") + '\')">' + u + '</button>';
  });
  container.innerHTML = html;
}

function renderAdmin() {
  const container = document.getElementById('admin-tab');
  const users = Object.keys(allUsers);
  if (users.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">👤</div><p>No other users yet.</p></div>';
    return;
  }
  let html = '';
  users.sort().forEach(u => {
    const count = (allUsers[u] || []).length;
    html += '<div class="admin-card">';
    html += '<div><div class="user-info">' + u + '</div><div class="pick-count">' + count + ' pick' + (count !== 1 ? 's' : '') + '</div></div>';
    html += '<button class="btn-rm" onclick="adminRemoveUser(\'' + u.replace(/'/g, "\\'") + '\')">Remove</button>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function adminRemoveUser(name) {
  delete allUsers[name];
  saveUsers();
  renderAdmin();
  showToast('Removed ' + name);
}

function removeUser(name) {
  delete allUsers[name];
  saveUsers();
  renderGroup();
}

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

async function loadGroupName(id) {
  const stored = localStorage.getItem('edc-group-names');
  let names = {};
  if (stored) { try { names = JSON.parse(stored); } catch(e) {} }
  let name = names[id] || 'Group';
  // Try to fetch latest from cloud for OG preview
  try {
    const res = await fetch('/api/data?meta=true');
    if (res.ok) {
      const meta = await res.json();
      if (meta[id] && meta[id].name) {
        name = meta[id].name;
        names[id] = name;
        localStorage.setItem('edc-group-names', JSON.stringify(names));
      }
    }
  } catch(e) {}
  const display = document.getElementById('group-name-display');
  if (display) display.textContent = name;
  document.title = name + ' — EDC 2026 Set Planner';
}

function newGroup() {
  const name = prompt('Enter a name for this group:');
  if (!name) return;
  const id = Math.random().toString(36).slice(2, 10);
  const stored = localStorage.getItem('edc-group-names');
  const names = stored ? JSON.parse(stored) : {};
  names[id] = name;
  localStorage.setItem('edc-group-names', JSON.stringify(names));
  // Save group name to cloud
  const payload = {};
  payload[id] = { name, createdAt: new Date().toISOString() };
  fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ groups: payload })
  }).catch(() => {});
  window.location.href = '?group=' + id;
}

function shareGroup() {
  const shareUrl = window.location.origin + '/g/' + currentGroup;
  const stored = localStorage.getItem('edc-group-names');
  let groupName = 'EDC 2026';
  if (stored) {
    try {
      const names = JSON.parse(stored);
      if (names[currentGroup]) groupName = names[currentGroup];
    } catch(e) {}
  }
  const title = groupName + ' — EDC 2026 Set Planner';
  if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    navigator.share({ title, url: shareUrl }).catch(() => {
      copyToClipboard(shareUrl);
    });
  } else {
    copyToClipboard(shareUrl);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Link copied!')).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Link copied!');
  }
}

(async function init() {
  // One-time migration: remove old monolithic edc-schedule (was causing index corruption)
  try {
    const oldSchedule = localStorage.getItem('edc-schedule');
    if (oldSchedule) {
      localStorage.removeItem('edc-schedule');
      console.log('Migrated away from old edc-schedule format');
    }
  } catch(e) {}

  // Parse group from URL
  const params = new URLSearchParams(window.location.search);
  currentGroup = params.get('group') || 'default';
  await loadSchedule();
  loadUsers();
  loadMustSee();
  await syncFromCloud();
  renderLoginUsers();
  loadGroupName(currentGroup);
  // Auto-login if saved user exists in this group
  const savedUser = localStorage.getItem('edc-current-user');
  if (savedUser && allUsers[savedUser]) {
    loginAs(savedUser);
  }
})();
</script>
